<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultofCodes - Assignments</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      display: inline-block;
      padding: 16px 36px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .links a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body>
  <h1>VaultofCodes</h1>
  <p>Select an assignment to view</p>
  <div class="links">
    <a href="ASSIGNMENT3/TASK1/">ASSIGNMENT 3 - TASK 1 (Internship Programs)</a>
    <a href="ASSIGNMENT3/TASK2/">ASSIGNMENT 3 - TASK 2 (Certificate Verifier)</a>
  </div>
</body>
</html>
